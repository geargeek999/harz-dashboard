<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>副驾DCT数据看板</title>
<script>
(function(){
  var PASS = "pangu";
  var ok = sessionStorage.getItem("dct_auth") === "1" || location.hostname === "10.21.163.195";
  if (!ok) {
    document.addEventListener("DOMContentLoaded", function(){
      document.body.style.display = "none";
      var overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;inset:0;background:#f0f4fa;display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:40px 48px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center;min-width:320px;">'
        + '<div style="font-size:28px;font-weight:700;color:#1e2a3a;margin-bottom:8px;">副驾DCT数据看板</div>'
        + '<div style="color:#5a6a85;margin-bottom:28px;">请输入访问密码</div>'
        + '<input id="pw" type="password" placeholder="Password" style="width:100%;padding:12px 16px;border:1.5px solid #dde4ef;border-radius:8px;font-size:15px;outline:none;box-sizing:border-box;margin-bottom:12px;" />'
        + '<div id="err" style="color:#ef4444;font-size:13px;margin-bottom:10px;min-height:18px;"></div>'
        + '<button id="btn" style="width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">进入</button>'
        + '</div>';
      document.body.parentNode.insertBefore(overlay, document.body);
      function tryLogin(){
        if(document.getElementById("pw").value === PASS){
          sessionStorage.setItem("dct_auth","1");
          overlay.remove();
          document.body.style.display = "";
        } else {
          document.getElementById("err").textContent = "密码错误，请重试";
          document.getElementById("pw").value = "";
          document.getElementById("pw").focus();
        }
      }
      document.getElementById("btn").addEventListener("click", tryLogin);
      document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryLogin(); });
      document.getElementById("pw").focus();
    });
  }
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }

/* ── header ── */
.header {
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  border-bottom: 1px solid #21262d;
  padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 20px; font-weight: 700; color: #58a6ff; }
.header-sub { font-size: 13px; color: #8b949e; margin-top: 3px; }
.header-updated { font-size: 12px; color: #8b949e; }

/* ── summary cards ── */
.cards { display: flex; gap: 20px; padding: 24px 32px 0; }
.card {
  flex: 1; background: #161b22; border: 1px solid #21262d;
  border-radius: 12px; padding: 20px 24px;
}
.card-title { font-size: 13px; color: #8b949e; margin-bottom: 14px; font-weight: 600; letter-spacing: .4px; }
.card-nums { display: flex; gap: 24px; margin-bottom: 14px; }
.card-num-item { text-align: center; }
.card-num-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
.num-vg   { font-size: 26px; font-weight: 700; color: #3fb950; }
.num-good { font-size: 26px; font-weight: 700; color: #58a6ff; }
.num-bad  { font-size: 26px; font-weight: 700; color: #f85149; }
.bar-wrap { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; display: flex; }
.bar-vg   { background: #3fb950; }
.bar-good { background: #58a6ff; }
.bar-bad  { background: #f85149; }
.bar-legend { font-size: 11px; color: #8b949e; margin-top: 6px; }

/* ── route table ── */
.section { padding: 24px 32px 32px; }
.section-title {
  font-size: 15px; font-weight: 700; color: #e6edf3;
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid #21262d;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; padding: 10px 12px;
  color: #8b949e; font-weight: 600; font-size: 12px;
  border-bottom: 1px solid #21262d; white-space: nowrap;
}
tbody tr { border-bottom: 1px solid #161b22; }
tbody tr:hover { background: #161b22; }
tbody td { padding: 10px 12px; vertical-align: middle; }
.td-route { font-weight: 600; color: #58a6ff; max-width: 260px; word-break: break-all; }
.td-num { text-align: right; color: #e6edf3; }
.td-good { text-align: right; color: #3fb950; font-weight: 600; }
.td-models { display: flex; flex-wrap: wrap; gap: 5px; }
.model-tag {
  background: #21262d; border: 1px solid #30363d;
  border-radius: 6px; padding: 2px 8px;
  font-size: 11px; color: #8b949e; white-space: nowrap;
}
.model-tag .laps { color: #58a6ff; font-weight: 600; }
.empty { color: #484f58; font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">副驾DCT数据看板</div>
    <div class="header-sub">项目: Harz &nbsp;|&nbsp; 时间: 2026-06-01 → 今日 &nbsp;|&nbsp; 已准出</div>
  </div>
  <div class="header-updated" id="updated">—</div>
</div>

<div class="cards">
  <div class="card">
    <div class="card-title">多人校准数据量（全车型汇总）</div>
    <div class="card-nums">
      <div class="card-num-item"><div class="card-num-label">Very Good</div><div class="num-vg" id="sc-vg">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Good</div><div class="num-good" id="sc-good">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Bad</div><div class="num-bad" id="sc-bad">—</div></div>
    </div>
    <div class="bar-wrap" id="sc-bar"></div>
    <div class="bar-legend" id="sc-legend"></div>
  </div>
  <div class="card">
    <div class="card-title">训练可用数据量（全车型汇总）</div>
    <div class="card-nums">
      <div class="card-num-item"><div class="card-num-label">Very Good</div><div class="num-vg" id="dlp-vg">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Good</div><div class="num-good" id="dlp-good">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Bad</div><div class="num-bad" id="dlp-bad">—</div></div>
    </div>
    <div class="bar-wrap" id="dlp-bar"></div>
    <div class="bar-legend" id="dlp-legend"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">路线 Bag 统计 — 按路线汇总圈数与采集数量</div>
  <table>
    <thead>
      <tr>
        <th>路线名称</th>
        <th style="text-align:right">圈数</th>
        <th style="text-align:right">采集数量</th>
        <th style="text-align:right">好数据量</th>
        <th>各车型（圈数 / 车辆号）</th>
      </tr>
    </thead>
    <tbody id="route-tbody"></tbody>
  </table>
</div>

<script>
function fmt(n) { return n > 0 ? n.toLocaleString() : '—'; }

function renderBar(barId, legendId, vg, good, bad) {
  const total = vg + good + bad;
  if (!total) return;
  const pct = v => (v / total * 100).toFixed(1);
  document.getElementById(barId).innerHTML =
    `<div class="bar-vg" style="width:${pct(vg)}%"></div>` +
    `<div class="bar-good" style="width:${pct(good)}%"></div>` +
    `<div class="bar-bad" style="width:${pct(bad)}%"></div>`;
  document.getElementById(legendId).textContent =
    `V.Good ${pct(vg)}%  ·  Good ${pct(good)}%  ·  Bad ${pct(bad)}%`;
}

fetch('dct_data.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updated').textContent = '数据时间: ' + (d.updated || '—');

    const sc = d.sc, dlp = d.dlp;
    document.getElementById('sc-vg').textContent   = fmt(sc.very_good);
    document.getElementById('sc-good').textContent = fmt(sc.good);
    document.getElementById('sc-bad').textContent  = fmt(sc.bad);
    renderBar('sc-bar','sc-legend', sc.very_good, sc.good, sc.bad);

    document.getElementById('dlp-vg').textContent   = fmt(dlp.very_good);
    document.getElementById('dlp-good').textContent = fmt(dlp.good);
    document.getElementById('dlp-bad').textContent  = fmt(dlp.bad);
    renderBar('dlp-bar','dlp-legend', dlp.very_good, dlp.good, dlp.bad);

    const tbody = document.getElementById('route-tbody');
    (d.routes || []).forEach(r => {
      const modelTags = Object.entries(r.models || {}).map(([model, info]) => {
        const vehs = (info.vehicles || []).join(', ');
        return `<span class="model-tag"><span class="laps">${model} ×${info.laps}</span> (${vehs})</span>`;
      }).join('');

      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td class="td-route">${r.route}</td>` +
        `<td class="td-num">${r.laps}</td>` +
        `<td class="td-num">${r.bag_cnt > 0 ? r.bag_cnt.toLocaleString() : '<span class="empty">—</span>'}</td>` +
        `<td class="td-good">${r.good_cnt > 0 ? r.good_cnt.toLocaleString() : '<span class="empty">—</span>'}</td>` +
        `<td><div class="td-models">${modelTags || '<span class="empty">—</span>'}</div></td>`;
      tbody.appendChild(tr);
    });
  })
  .catch(() => {
    document.getElementById('route-tbody').innerHTML =
      '<tr><td colspan="5" style="text-align:center;color:#8b949e;padding:40px">暂无数据</td></tr>';
  });
</script>
</body>
</html>
