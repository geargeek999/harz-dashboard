<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>副驾DCT数据看板</title>
<script>
(function(){
  var PASS = "pangu";
  var ok = sessionStorage.getItem("dct_auth") === "1";
  if (!ok) {
    document.addEventListener("DOMContentLoaded", function(){
      document.body.style.display = "none";
      var overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;inset:0;background:#f0f4fa;display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:40px 48px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center;min-width:320px;">'
        + '<div style="font-size:28px;font-weight:700;color:#1e2a3a;margin-bottom:8px;">副驾DCT数据看板</div>'
        + '<div style="color:#5a6a85;margin-bottom:28px;">请输入访问密码</div>'
        + '<input id="pw" type="password" placeholder="Password" style="width:100%;padding:12px 16px;border:1.5px solid #dde4ef;border-radius:8px;font-size:15px;outline:none;box-sizing:border-box;margin-bottom:12px;" />'
        + '<div id="err" style="color:#ef4444;font-size:13px;margin-bottom:10px;min-height:18px;"></div>'
        + '<button id="btn" style="width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">进入</button>'
        + '</div>';
      document.body.parentNode.insertBefore(overlay, document.body);
      function tryLogin(){
        if(document.getElementById("pw").value === PASS){
          sessionStorage.setItem("dct_auth","1");
          overlay.remove();
          document.body.style.display = "";
        } else {
          document.getElementById("err").textContent = "密码错误，请重试";
          document.getElementById("pw").value = "";
          document.getElementById("pw").focus();
        }
      }
      document.getElementById("btn").addEventListener("click", tryLogin);
      document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryLogin(); });
      document.getElementById("pw").focus();
    });
  }
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1e2a3a; min-height: 100vh; }

.header {
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.header-title { font-size: 20px; font-weight: 700; color: #2563eb; }
.header-sub { font-size: 13px; color: #64748b; margin-top: 3px; }
.header-updated { font-size: 12px; color: #94a3b8; }

/* summary card */
.summary-wrap { padding: 24px 32px 0; }
.summary-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
  padding: 20px 28px; display: inline-flex; flex-direction: column; min-width: 480px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.card-title { font-size: 13px; color: #64748b; margin-bottom: 14px; font-weight: 600; letter-spacing: .4px; }
.card-nums { display: flex; gap: 28px; margin-bottom: 14px; align-items: flex-end; }
.card-num-item { text-align: center; }
.card-num-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
.num-vg   { font-size: 26px; font-weight: 700; color: #16a34a; }
.num-good { font-size: 26px; font-weight: 700; color: #2563eb; }
.num-bad  { font-size: 26px; font-weight: 700; color: #dc2626; }
.num-unk  { font-size: 26px; font-weight: 700; color: #94a3b8; }
.num-total { font-size: 13px; color: #64748b; }
.bar-wrap { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; display: flex; }
.bar-vg   { background: #16a34a; }
.bar-good { background: #2563eb; }
.bar-bad  { background: #dc2626; }
.bar-unk  { background: #cbd5e1; }
.bar-legend { font-size: 11px; color: #94a3b8; margin-top: 6px; }

/* platform sections */
.section { padding: 24px 32px 12px; }
.platform-header {
  font-size: 14px; font-weight: 700; color: #fff;
  background: linear-gradient(90deg, #1d4ed8 0%, #3b82f6 100%);
  padding: 8px 16px; border-radius: 8px; margin-bottom: 12px;
}
.platform-header.st3 { background: linear-gradient(90deg, #6d28d9 0%, #8b5cf6 100%); }

table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; table-layout: fixed; }
thead th {
  text-align: center; padding: 8px 12px;
  color: #64748b; font-weight: 600; font-size: 12px;
  border-bottom: 1px solid #e2e8f0; background: #f8fafc;
}
thead th:first-child { text-align: left; width: 220px; }
.td-bags { text-align: center; color: #16a34a; font-weight: 600; }
tbody tr { border-bottom: 1px solid #f1f5f9; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 9px 12px; vertical-align: middle; text-align: center; }
td:first-child { font-weight: 600; color: #1e2a3a; text-align: left; }
.td-vg   { text-align: center; color: #16a34a; font-weight: 600; }
.td-good { text-align: center; color: #2563eb; font-weight: 600; }
.td-bad  { text-align: center; color: #dc2626; }
.td-unk  { text-align: center; color: #94a3b8; }
.td-bar  { width: 100px; padding-right: 16px; }
.mini-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; min-width: 80px; }
.empty-row td { color: #cbd5e1; font-style: italic; }
.total-row td { border-top: 1px solid #e2e8f0; font-weight: 700; color: #1e2a3a; padding-top: 10px; }
.total-row .td-vg   { color: #16a34a; }
.total-row .td-good { color: #2563eb; }
.total-row .td-bad  { color: #dc2626; }
.total-row .td-unk  { color: #94a3b8; }
.td-progress { min-width: 140px; }
.progress-wrap { display:flex; align-items:center; gap:8px; }
.progress-bar-bg { flex:1; height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; }
.progress-bar-fill { height:100%; border-radius:4px; background:#16a34a; transition:width .3s; }
.progress-bar-fill.warn { background:#f59e0b; }
.progress-bar-fill.low  { background:#e2e8f0; }
.progress-pct { font-size:12px; font-weight:700; color:#16a34a; white-space:nowrap; min-width:38px; }
.progress-pct.warn { color:#f59e0b; }
.progress-pct.low  { color:#94a3b8; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">副驾DCT数据看板</div>
    <div class="header-sub">项目: Harz &nbsp;|&nbsp; 时间: 2026-06-01 → 今日 &nbsp;|&nbsp; 已准出</div>
  </div>
  <div class="header-updated" id="updated">—</div>
</div>

<div class="summary-wrap" style="display:flex;gap:16px;flex-wrap:wrap">
  <div class="summary-card" style="min-width:200px;max-width:240px">
    <div class="card-title">累计采集包数（UNP/HNP）</div>
    <div class="card-nums" style="justify-content:center">
      <div class="card-num-item">
        <div class="card-num-label">总包数</div>
        <div class="num-vg" id="total-bags" style="font-size:30px">—</div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="platform-header">ST35 平台 — 449_A1p0 / C590 / V174 / V178 / V520 / V540</div>
  <table>
    <thead><tr>
      <th>车型</th>
      <th>采集包数</th>
      <th>有效包数</th>
      <th>完成进度</th>
    </tr></thead>
    <tbody id="st35-body"></tbody>
  </table>
</div>

<div class="section">
  <div class="platform-header st3">ST3 平台 — C167 / T167 / X167 / X167_Maybach / V167 / V223M / Z223M / V206M</div>
  <table>
    <thead><tr>
      <th>车型</th>
      <th>采集包数</th>
      <th>有效包数</th>
      <th>完成进度</th>
    </tr></thead>
    <tbody id="st3-body"></tbody>
  </table>
</div>

<script>
const ST35 = ["449_A1p0","C590","V174","V178","V520","V540"];
const ST3  = ["C167","T167","X167","X167_Maybach","V167","V223M","Z223M","V206M"];

function fmt(n) { return (n > 0) ? n.toLocaleString() : '0'; }

function miniBar(vg, good, bad, unk) {
  const total = vg + good + bad + unk;
  if (!total) return '<div class="mini-bar" style="background:#e2e8f0"></div>';
  const p = v => (v / total * 100).toFixed(1);
  return `<div class="mini-bar">
    <div style="background:#16a34a;width:${p(vg)}%"></div>
    <div style="background:#2563eb;width:${p(good)}%"></div>
    <div style="background:#dc2626;width:${p(bad)}%"></div>
    <div style="background:#cbd5e1;width:${p(unk)}%"></div>
  </div>`;
}

const TARGET = 20000;
function progressCell(eff) {
  if (!eff) return `<td class="td-progress"><span style="color:#cbd5e1">—</span></td>`;
  const pct = Math.min(eff / TARGET * 100, 100);
  const cls = pct >= 100 ? '' : pct >= 50 ? 'warn' : 'low';
  return `<td class="td-progress">
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
      <span class="progress-pct ${cls}">${pct.toFixed(1)}%</span>
    </div>
  </td>`;
}

function renderTable(tbodyId, models, data) {
  const tbody = document.getElementById(tbodyId);
  let totBags=0, totEff=0;
  models.forEach(m => {
    const sc = (data[m]) || {very_good:0,good:0,bad:0,unknown:0,bags:0,effective_bags:0};
    const bags=sc.bags||0, eff=sc.effective_bags||0;
    const total = (sc.very_good||0)+(sc.good||0)+(sc.bad||0)+(sc.unknown||0);
    totBags+=bags; totEff+=eff;
    const tr = document.createElement('tr');
    if (!total && !bags) tr.className = 'empty-row';
    const bagsCell = bags > 0
      ? `<td class="td-bags">${bags.toLocaleString()}</td>`
      : `<td style="text-align:center;color:#cbd5e1">0</td>`;
    const effCell = eff > 0
      ? `<td class="td-good">${eff.toLocaleString()}</td>`
      : `<td style="text-align:center;color:#cbd5e1">—</td>`;
    tr.innerHTML = `<td>${m}</td>` + bagsCell + effCell + progressCell(eff);
    tbody.appendChild(tr);
  });
  const tr = document.createElement('tr');
  tr.className = 'total-row';
  tr.innerHTML = `<td>合计</td>`
    + `<td class="td-bags">${totBags.toLocaleString()}</td>`
    + `<td class="td-good">${totEff.toLocaleString()}</td>`
    + progressCell(totEff);
  tbody.appendChild(tr);
}

fetch('dct_data.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updated').textContent = '数据时间: ' + (d.updated || '—');
    if (d.total_bags != null) document.getElementById('total-bags').textContent = d.total_bags.toLocaleString();

    const models = d.models || {};
    renderTable('st35-body', ST35, models);
    renderTable('st3-body',  ST3,  models);
  })
  .catch(() => {
    document.getElementById('updated').textContent = '数据加载失败';
  });
</script>
</body>
</html>
