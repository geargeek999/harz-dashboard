<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>副驾DCT数据看板</title>
<script>
(function(){
  var PASS = "pangu";
  var ok = sessionStorage.getItem("dct_auth") === "1";
  if (!ok) {
    document.addEventListener("DOMContentLoaded", function(){
      document.body.style.display = "none";
      var overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;inset:0;background:#f0f4fa;display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:40px 48px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center;min-width:320px;">'
        + '<div style="font-size:28px;font-weight:700;color:#1e2a3a;margin-bottom:8px;">副驾DCT数据看板</div>'
        + '<div style="color:#5a6a85;margin-bottom:28px;">请输入访问密码</div>'
        + '<input id="pw" type="password" placeholder="Password" style="width:100%;padding:12px 16px;border:1.5px solid #dde4ef;border-radius:8px;font-size:15px;outline:none;box-sizing:border-box;margin-bottom:12px;" />'
        + '<div id="err" style="color:#ef4444;font-size:13px;margin-bottom:10px;min-height:18px;"></div>'
        + '<button id="btn" style="width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">进入</button>'
        + '</div>';
      document.body.parentNode.insertBefore(overlay, document.body);
      function tryLogin(){
        if(document.getElementById("pw").value === PASS){
          sessionStorage.setItem("dct_auth","1");
          overlay.remove();
          document.body.style.display = "";
        } else {
          document.getElementById("err").textContent = "密码错误，请重试";
          document.getElementById("pw").value = "";
          document.getElementById("pw").focus();
        }
      }
      document.getElementById("btn").addEventListener("click", tryLogin);
      document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryLogin(); });
      document.getElementById("pw").focus();
    });
  }
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }

.header {
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  border-bottom: 1px solid #21262d;
  padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 20px; font-weight: 700; color: #58a6ff; }
.header-sub { font-size: 13px; color: #8b949e; margin-top: 3px; }
.header-updated { font-size: 12px; color: #8b949e; }

/* summary card */
.summary-wrap { padding: 24px 32px 0; }
.summary-card {
  background: #161b22; border: 1px solid #21262d; border-radius: 12px;
  padding: 20px 28px; display: inline-flex; flex-direction: column; min-width: 480px;
}
.card-title { font-size: 13px; color: #8b949e; margin-bottom: 14px; font-weight: 600; letter-spacing: .4px; }
.card-nums { display: flex; gap: 28px; margin-bottom: 14px; align-items: flex-end; }
.card-num-item { text-align: center; }
.card-num-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
.num-vg   { font-size: 26px; font-weight: 700; color: #3fb950; }
.num-good { font-size: 26px; font-weight: 700; color: #58a6ff; }
.num-bad  { font-size: 26px; font-weight: 700; color: #f85149; }
.num-unk  { font-size: 26px; font-weight: 700; color: #8b949e; }
.num-total { font-size: 13px; color: #8b949e; }
.bar-wrap { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; display: flex; }
.bar-vg   { background: #3fb950; }
.bar-good { background: #58a6ff; }
.bar-bad  { background: #f85149; }
.bar-unk  { background: #484f58; }
.bar-legend { font-size: 11px; color: #8b949e; margin-top: 6px; }

/* platform sections */
.section { padding: 24px 32px 12px; }
.platform-header {
  font-size: 14px; font-weight: 700; color: #fff;
  background: linear-gradient(90deg, #1f6feb 0%, #388bfd 100%);
  padding: 8px 16px; border-radius: 8px; margin-bottom: 12px;
}
.platform-header.st3 { background: linear-gradient(90deg, #6e40c9 0%, #a371f7 100%); }

table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
thead th {
  text-align: right; padding: 8px 12px;
  color: #8b949e; font-weight: 600; font-size: 12px;
  border-bottom: 1px solid #21262d;
}
thead th:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid #1a2030; }
tbody tr:hover { background: #161b22; }
tbody td { padding: 9px 12px; vertical-align: middle; }
td:first-child { font-weight: 600; color: #e6edf3; }
.td-vg   { text-align: right; color: #3fb950; font-weight: 600; }
.td-good { text-align: right; color: #58a6ff; font-weight: 600; }
.td-bad  { text-align: right; color: #f85149; }
.td-unk  { text-align: right; color: #8b949e; }
.td-bar  { width: 100px; padding-right: 16px; }
.mini-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; min-width: 80px; }
.empty-row td { color: #484f58; font-style: italic; }
.total-row td { border-top: 1px solid #30363d; font-weight: 700; color: #e6edf3; padding-top: 10px; }
.total-row .td-vg   { color: #3fb950; }
.total-row .td-good { color: #58a6ff; }
.total-row .td-bad  { color: #f85149; }
.total-row .td-unk  { color: #8b949e; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">副驾DCT数据看板</div>
    <div class="header-sub">项目: Harz &nbsp;|&nbsp; 时间: 2026-06-01 → 今日 &nbsp;|&nbsp; 已准出</div>
  </div>
  <div class="header-updated" id="updated">—</div>
</div>

<div class="summary-wrap">
  <div class="summary-card">
    <div class="card-title">多人校准数据量（全车型汇总）</div>
    <div class="card-nums">
      <div class="card-num-item"><div class="card-num-label">Very Good</div><div class="num-vg"  id="sc-vg">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Good</div>     <div class="num-good" id="sc-good">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Bad</div>      <div class="num-bad"  id="sc-bad">—</div></div>
      <div class="card-num-item"><div class="card-num-label">Unknown</div>  <div class="num-unk"  id="sc-unk">—</div></div>
      <div class="card-num-item" style="margin-left:12px"><div class="card-num-label">总计</div><div class="num-total" id="sc-total">—</div></div>
    </div>
    <div class="bar-wrap" id="sc-bar"></div>
    <div class="bar-legend" id="sc-legend"></div>
  </div>
</div>

<div class="section">
  <div class="platform-header">ST35 平台 — 449_A1p0 / C590 / V174 / V178 / V520 / V540</div>
  <table>
    <thead><tr>
      <th>车型</th>
      <th>Very Good</th><th>Good</th><th>Bad</th><th>Unknown</th><th class="td-bar">分布</th>
    </tr></thead>
    <tbody id="st35-body"></tbody>
  </table>
</div>

<div class="section">
  <div class="platform-header st3">ST3 平台 — C167 / T167 / X167 / X167_Maybach / V167 / V223M / Z223M / V206M</div>
  <table>
    <thead><tr>
      <th>车型</th>
      <th>Very Good</th><th>Good</th><th>Bad</th><th>Unknown</th><th class="td-bar">分布</th>
    </tr></thead>
    <tbody id="st3-body"></tbody>
  </table>
</div>

<script>
const ST35 = ["449_A1p0","C590","V174","V178","V520","V540"];
const ST3  = ["C167","T167","X167","X167_Maybach","V167","V223M","Z223M","V206M"];

function fmt(n) { return (n > 0) ? n.toLocaleString() : '0'; }

function miniBar(vg, good, bad, unk) {
  const total = vg + good + bad + unk;
  if (!total) return '<div class="mini-bar" style="background:#21262d"></div>';
  const p = v => (v / total * 100).toFixed(1);
  return `<div class="mini-bar">
    <div style="background:#3fb950;width:${p(vg)}%"></div>
    <div style="background:#58a6ff;width:${p(good)}%"></div>
    <div style="background:#f85149;width:${p(bad)}%"></div>
    <div style="background:#484f58;width:${p(unk)}%"></div>
  </div>`;
}

function renderTable(tbodyId, models, data) {
  const tbody = document.getElementById(tbodyId);
  let totVg=0, totGood=0, totBad=0, totUnk=0;
  models.forEach(m => {
    const sc = (data[m]) || {very_good:0,good:0,bad:0,unknown:0};
    const vg=sc.very_good||0, good=sc.good||0, bad=sc.bad||0, unk=sc.unknown||0;
    const total = vg+good+bad+unk;
    totVg+=vg; totGood+=good; totBad+=bad; totUnk+=unk;
    const tr = document.createElement('tr');
    if (!total) tr.className = 'empty-row';
    tr.innerHTML = `<td>${m}</td>`
      + (total ? `<td class="td-vg">${fmt(vg)}</td><td class="td-good">${fmt(good)}</td><td class="td-bad">${fmt(bad)}</td><td class="td-unk">${fmt(unk)}</td>`
               : `<td colspan="4" style="text-align:center;color:#484f58;font-style:italic">暂无数据</td>`)
      + `<td class="td-bar">${total ? miniBar(vg,good,bad,unk) : ''}</td>`;
    tbody.appendChild(tr);
  });
  const tr = document.createElement('tr');
  tr.className = 'total-row';
  tr.innerHTML = `<td>合计</td>`
    + `<td class="td-vg">${fmt(totVg)}</td><td class="td-good">${fmt(totGood)}</td><td class="td-bad">${fmt(totBad)}</td><td class="td-unk">${fmt(totUnk)}</td>`
    + `<td class="td-bar">${miniBar(totVg,totGood,totBad,totUnk)}</td>`;
  tbody.appendChild(tr);
}

fetch('dct_data.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updated').textContent = '数据时间: ' + (d.updated || '—');

    const sc = d.sc;
    const vg=sc.very_good||0, good=sc.good||0, bad=sc.bad||0, unk=sc.unknown||0;
    const total = vg+good+bad+unk;
    document.getElementById('sc-vg').textContent   = fmt(vg);
    document.getElementById('sc-good').textContent = fmt(good);
    document.getElementById('sc-bad').textContent  = fmt(bad);
    document.getElementById('sc-unk').textContent  = fmt(unk);
    document.getElementById('sc-total').textContent = '总计: ' + total.toLocaleString();
    if (total) {
      const p = v => (v/total*100).toFixed(1);
      document.getElementById('sc-bar').innerHTML =
        `<div class="bar-vg" style="width:${p(vg)}%"></div>`+
        `<div class="bar-good" style="width:${p(good)}%"></div>`+
        `<div class="bar-bad" style="width:${p(bad)}%"></div>`+
        `<div class="bar-unk" style="width:${p(unk)}%"></div>`;
      document.getElementById('sc-legend').textContent =
        `VG ${p(vg)}%  ·  Good ${p(good)}%  ·  Bad ${p(bad)}%  ·  Unk ${p(unk)}%`;
    }

    const models = d.models || {};
    renderTable('st35-body', ST35, models);
    renderTable('st3-body',  ST3,  models);
  })
  .catch(() => {
    document.getElementById('updated').textContent = '数据加载失败';
  });
</script>
</body>
</html>
